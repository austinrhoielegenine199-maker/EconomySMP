# Configuration section for Webhooks.
WEBHOOKS:
  # Determines whether Enabled is enabled or disabled. Available options: true, false
  ENABLED: true
  # The text or value for Url. Available options: Any valid string text
  URL: https://discord.com/api/webhooks/your_webhook_here
  # The text or value for Avatar Api. Available options: Any valid string text
  AVATAR_API: https://visage.surgeplay.com/face/128/%uuid_no_dash%
  # The text or value for Model Api. Available options: Any valid string text
  MODEL_API: https://visage.surgeplay.com/full/384/%uuid_no_dash%
  # The text or value for Bust Api. Available options: Any valid string text
  BUST_API: https://visage.surgeplay.com/bust/384/%uuid_no_dash%
  MESSAGES:
    # Configuration section for Ban.
    BAN:
      # Determines whether Enabled is enabled or disabled. Available options: true, false
      ENABLED: true
      TITLE: Player Banned - %player%
      # The text or value for Color. Available options: Any valid string text
      COLOR: '#FF0000'
      # The text or value for Description. Available options: Any valid string text
      DESCRIPTION: |-
        :hammer: **Punishment Type:** Ban

        **Player:**
        %player%

        **Staff:**
        %staff%

        **Reason:**
        ||%reason%||

        **Duration:**
        %duration%

        **Date:**
        %date%

        **ID:** `%id%`
      # The text or value for Thumbnail. Available options: Any valid string text
      THUMBNAIL: '%skin_bust%'
      # The text or value for Author Name. Available options: Any valid string text
      AUTHOR_NAME: Ban System
      # The text or value for Footer. Available options: Any valid string text
      FOOTER: Punishment issued via server
    # Configuration section for Mute.
    MUTE:
      # Determines whether Enabled is enabled or disabled. Available options: true, false
      ENABLED: true
      TITLE: Player Muted - %player%
      # The text or value for Color. Available options: Any valid string text
      COLOR: '#FFFF00'
      # The text or value for Description. Available options: Any valid string text
      DESCRIPTION: |-
        :mute: **Punishment Type:** Mute

        **Player:**
        %player%

        **Staff:**
        %staff%

        **Reason:**
        ||%reason%||

        **Duration:**
        %duration%

        **Date:**
        %date%

        **ID:** `%id%`
      # The text or value for Thumbnail. Available options: Any valid string text
      THUMBNAIL: '%skin_bust%'
      # The text or value for Author Name. Available options: Any valid string text
      AUTHOR_NAME: Moderation System
      # The text or value for Footer. Available options: Any valid string text
      FOOTER: Chat restriction applied
    # Configuration section for Warn.
    WARN:
      # Determines whether Enabled is enabled or disabled. Available options: true, false
      ENABLED: true
      TITLE: Player Warned - %player%
      # The text or value for Color. Available options: Any valid string text
      COLOR: '#FFA500'
      # The text or value for Description. Available options: Any valid string text
      DESCRIPTION: |-
        :warning: **Punishment Type:** Warning

        **Player:**
        %player%

        **Staff:**
        %staff%

        **Reason:**
        ||%reason%||

        **Date:**
        %date%

        **ID:** `%id%`
      # The text or value for Thumbnail. Available options: Any valid string text
      THUMBNAIL: '%skin_bust%'
      # The text or value for Author Name. Available options: Any valid string text
      AUTHOR_NAME: Moderation System
      # The text or value for Footer. Available options: Any valid string text
      FOOTER: Warning issued
    # Configuration section for Kick.
    KICK:
      # Determines whether Enabled is enabled or disabled. Available options: true, false
      ENABLED: true
      TITLE: Player Kicked - %player%
      # The text or value for Color. Available options: Any valid string text
      COLOR: '#FF6347'
      # The text or value for Description. Available options: Any valid string text
      DESCRIPTION: |-
        :boot: **Punishment Type:** Kick

        **Player:**
        %player%

        **Staff:**
        %staff%

        **Reason:**
        ||%reason%||

        **Date:**
        %date%
      # The text or value for Thumbnail. Available options: Any valid string text
      THUMBNAIL: '%skin_bust%'
      # The text or value for Author Name. Available options: Any valid string text
      AUTHOR_NAME: Moderation System
      # The text or value for Footer. Available options: Any valid string text
      FOOTER: Player was removed from server
    # Configuration section for Blacklist.
    BLACKLIST:
      # Determines whether Enabled is enabled or disabled. Available options: true, false
      ENABLED: true
      TITLE: PLAYER BLACKLISTED - %player%
      # The text or value for Color. Available options: Any valid string text
      COLOR: '#000000'
      # The text or value for Description. Available options: Any valid string text
      DESCRIPTION: |-
        :no_entry: **PERMANENT NETWORK BAN**

        **Player:**
        %player%

        **Staff:**
        %staff%

        **Reason:**
        ||%reason%||

        **Date:**
        %date%

        **ID:** `%id%`

        :exclamation:
        This is a permanent network-wide ban
      # The text or value for Thumbnail. Available options: Any valid string text
      THUMBNAIL: '%skin_bust%'
      # The text or value for Author Name. Available options: Any valid string text
      AUTHOR_NAME: Security System
      # The text or value for Footer. Available options: Any valid string text
      FOOTER: Blacklist enforced

    AUCTION_LISTED:
      ENABLED: true
      TITLE: 'New Auction Listed'
      COLOR: '#009BFF'
      DESCRIPTION: |-
        A new item was listed in the Auction House.

        **Item:** %item% x%amount%
        **Price:** %price%
        **Category:** %category%
        **Seller:** %player%
        **Listing ID:** #%id%
        **Expires:** %expires%
      AUTHOR_NAME: EconomySMP Auction House
      FOOTER: New auction listing
      TIMESTAMP: true
    ORDER_CREATED:
      ENABLED: true
      TITLE: 'New Item Order'
      COLOR: '#2ECC71'
      DESCRIPTION: |-
        A new player order was created.

        **Requested Item:** %item%
        **Quantity:** %quantity%
        **Price Each:** %price%
        **Total Budget:** %total%
        **Category:** %category%
        **Buyer:** %player%
        **Order ID:** #%id%
        **Expires:** %expires%
      AUTHOR_NAME: EconomySMP Orders
      FOOTER: New player order
      TIMESTAMP: true

# Discord account linking used by the separate discord-bot-example Node.js bot.
# Keep the bot token and application IDs in discord-bot-example/.env; do not put secrets here.
ACCOUNT_LINKING:
  # Enables or disables /pvp sync codes in game.
  ENABLED: true
  # One-time code expiration. Examples: 5m, 10m, 1h.
  EXPIRES: 10m
  # Code length; values are clamped to 4-16 characters.
  CODE_LENGTH: 6

# Settings consumed by discord-bot-example/src/index.js.
# Prefer environment variables for production secrets. If configured here, protect this file
# from public access and never commit a real bot token to the repository.
BOT:
  # Discord bot token. Keep blank here and set DISCORD_TOKEN in .env for safer deployments.
  TOKEN: ''
  # Discord application/client ID.
  CLIENT_ID: ''
  # Optional test guild ID; blank deploys commands globally.
  GUILD_ID: ''
  # Optional channel for ranked PvP match result embeds.
  PVP_MATCH_CHANNEL_ID: ''
  # Polling interval for match results, in seconds.
  PVP_MATCH_POLL_SECONDS: 15
  # Bot-owned link database file, relative to discord-bot-example unless absolute.
  LINKS_FILE: data/links.db

  # Editable Discord account-linking command replies. Supports {player}, {code}, {command}.
  LINK_PROMPT: 'Run /pvp sync in Minecraft, then use /link code:{code} here.'
  LINK_SUCCESS: 'Successfully linked Minecraft account **{player}** to your Discord account!'
  LINK_INVALID: 'That link code is invalid. Run /pvp sync in Minecraft to get a new one.'
  LINK_EXPIRED: 'That link code has expired. Run /pvp sync in Minecraft to get a new one.'
  LINK_USED: 'That link code has already been used. Generate a new one with /pvp sync.'
  LINK_TAKEN: 'That Minecraft account is already linked to another Discord user. They must use /unsync first.'
  LINK_ALREADY_LINKED: 'Your Discord account is already linked to **{player}**. Use /unsync before linking another account.'
  UNLINK_SUCCESS: 'Successfully unlinked **{player}** from your Discord account.'
  UNLINK_NOT_LINKED: 'Your Discord account is not linked to a Minecraft account.'
