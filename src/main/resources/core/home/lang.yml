# Home messages. Placeholders: %home%, %player%, %count%, %max_homes%
prefix-enable: false
prefix: "&x&2&4&F&1&0&4&lHOMES &7»"

messages:
  no-permission: "&cYou don't have permission for this!"
  player-only: "&cOnly players can use this command!"
  reload-success: "&aHomes has been reloaded!"
  home-set: "&fHome &a%home% &fhas been set"
  home-deleted: "&fHome &c%home% &fhas been deleted"
  home-not-found: "&fHome &c%home% &fwas not found!"
  max-homes: "&cYou have reached the maximum number of homes! &7(%max_homes%)"
  home-already-set: "&fHome &c%home% &fis already set"
  premium-locked: "&fThis home can only be used with &#0044FCDonut+&f!"
  teleport-cancelled: "&cTeleport cancelled!"
  teleport-completed: "&aYou have been teleported to home %home%!"
  already-teleporting: "&cYou are already teleporting!"
  invalid-home: "&cInvalid home number!"
  player-not-found: "&cPlayer not found!"
  opening-others-gui: "&fOpen the Gui for &c%player%"
  admin-home-set: "&fHome &a%home% &fhas been set for &c%player%"
  admin-teleport-completed: "&fYou have been teleported to home &a%home% of &c%player%!"
  world-blocked: "&cYou can't set a home here! &7(%world%)"
  region-blocked: "&cYou can't set a home here! &7(%region%)"
  rename-success: "&fHome &a%home% &fhas been renamed to &a%name%&f!"
  rename-too-long: "&cHome names can only be up to 20 characters long!"
  rename-invalid-chars: "&cInvalid name!"
  rename-prompt: "&cType the new name for your home in the chat!"
  rename-cancelled: "&cHome renaming cancelled!"
  team-no-team: "&cYou don't have a team!"
  team-no-home: "&cYour team has not set a home!"
  team-home-disabled: "&cTeam homes are currently disabled on this server!"
  team-home-set: "&aTeam home has been set!"
  team-home-teleport: "&aYou have been teleported to Team home!"
  team-created: "&fYour team &#34eb9b%team% &fhas been created."
  team-deleted: "&cTeam %team% has been deleted!"
  team-joined: "&fYou have joined team &#34eb9b%team%"
  team-left: "&cYou have left your team."
  team-invite-sent: "&aInvitation sent to %player%."
  team-invite-received: "&fYou have been invited to team &#34eb9b%team%&f. Use /team join %team%"
  team-already-exists: "&cA team with this name already exists!"
  team-already-in: "&cYou are already in a team!"
  team-not-in: "&cYou are not in a team!"
  team-not-found: "&cTeam not found!"
  team-not-leader: "&cOnly the team leader can do that!"
  team-player-not-found: "&cPlayer not found or offline."
  team-usage: "&cUsage: /team <create|invite|join|leave|delete|sethome|home|info>"
  no-permission: "&cYou don't have permission for this!"

action-bars:
  reload-success: "&aHomes has been reloaded!"
  teleport-cancelled: "&cTeleport cancelled!"
  teleport-completed: "&aYou have been teleported to home %home%!"
  already-teleporting: "&cYou are already teleporting!"

command-usage: |
  &x&2&4&F&1&0&4&lHOME
  &x&2&4&F&1&0&4➤ &f/home
  &x&2&4&F&1&0&4➤ &f/sethome <1-5>
  &x&2&4&F&1&0&4➤ &f/delhome <1-5>

command-usage-admin: |
  &#FF0000&lHome ADMIN
  &#FF0000➤ &f/home reload
  &#FF0000➤ &f/home admin <player>

cooldown:
  module:
    chat:
      enabled: true
      message:
        - "&fTeleport in &b%count% &fseconds"
    actionbar:
      enabled: true
      message:
        - "&fTeleport in &b%count% &fseconds"
    title:
      enabled: false
      message:
        - ""
    subtitle:
      enabled: false
      message:
        - ""
