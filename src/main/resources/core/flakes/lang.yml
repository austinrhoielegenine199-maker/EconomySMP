# Flakes messages. Supported placeholders include %player%, %flakes%, %flakes_send%,
# %flakes_given%, %flakes_taken%, %flakes_received%, %flakes_set%, %target_player%.
prefix-enable: true
prefix: "&#009bffғʟᴀᴋᴇꜱ &7» "
no-permission: '&cYou have no permission for that!'
player-only: 'Only players can use this command!'
player-not-found: "&cPlayer not found"
reload-success: '&aFlakes reloaded successfully!'
invalid-number: "&cInvalid number!"
not-enough-flakes: "&cYou do not have enough Flakes!"
not-enough-money: "&cYou do not have enough money!"
max-level-reached: "&cYou reached the max Flakes level!"
self-pay: "&cYou cannot give yourself Flakes!"
economy-not-available: "&cThe economy system is not available!"
booster-item-received: "&fYou received a &b%amount%x &fFlakes Booster for &b%time% &fhours!"
booster-expired: "&cYour Flakes Booster has expired!"
booster-activated: "&fYour Flakes Booster is now active for &b%time%&f hours!"
booster-remaining: "&fYour Flakes Booster is active for another &b%time%&f!"
gui-updated: "&aFlakes GUI reloaded successfully!"
send-flakes-chat-input: |
  &cPlease write the number in chat,
  &cor type cancel to cancel the input!
send-flakes-chat-cancel: "&cInput cancelled!"
flakes-balance: "&fBalance: &b%flakes% Flakes"
flakes-balance-other: "&a%target% &fhas &b%flakes% Flakes&f!"
flakes-send: "&fYou sent &b%flakes_send% Flakes &fto &a%player%"
flakes-received: "&fYou received &b%flakes_received% Flakes &ffrom &a%target_player%"
flakes-given: "&fYou gave &b%flakes_given% Flakes &fto &a%player%!"
flakes-taken: "&fYou took &b%flakes_taken% Flakes &ffrom &a%player%!"
flakes-set: "&fYou set the Flakes of &a%player% &fto &b%flakes_set%&f!"
clear-all-success: "&aSuccessfully cleared all Flakes and levels from all players!"
command-usage: |
  &#009bff&lFLAKES
  &b➤ &f/flakes
  &b➤ &f/flakes pay <player> <amount>
  &b➤ &f/flakes bal <player>
command-usage-admin: |
  &#009bff&lFLAKES ADMIN
  &b➤ &f/flakes reload
  &b➤ &f/flakes give <player> <amount>
  &b➤ &f/flakes take <player> <amount>
  &b➤ &f/flakes set <player> <amount>
