
SETTINGS:
  ENABLED: false
  RESPAWN_DELAY_SECONDS: 3
  DROP_KIT_ON_DEATH: false
  HEAL_ON_SPAWN: true
  KILL_OUTSIDE_BOUNDARY: true
  SPAWN_PROTECTION_SECONDS: 3
  LOBBY_ON_REJOIN: true
  CLEAR_KIT_ON_LEAVE: true

ARENA:
  NAME: 'Arena'
  WORLD: ''
  SPAWN: ''
  SPAWN_2: ''
  LOBBY: ''
  BOUNDARY_POS1: ''
  BOUNDARY_POS2: ''
  BOUNDARY_PADDING: 2

RESET:
  ENABLED: false
  INTERVAL: '24h'
  WARNING_SECONDS: 30
  EVACUATE: true
  SCHEMATIC: 'arena'
  PASTE_LOCATION: ''
  COMMANDS:
  - '//schematic load {schematic}'
  - '//paste -o -a'
  PASTE_DELAY_SECONDS: 5

MATCH:
  ENABLED: true
  COUNTDOWN_SECONDS: 5
  MAX_DURATION: '5m'
  ELO_WIN: 20
  ELO_LOSS: 15
  ELO_DRAW: 0
  HEAL_ON_START: true
  DATE_FORMAT: 'dd/MM/yyyy HH:mm'

SYNC:
  ENABLED: true
  CODE_LENGTH: 6
  EXPIRES: '10m'

BLOCKED_COMMANDS:
  ENABLED: true
  COMMANDS:
  - 'shop'
  - 'sell'
  - 'ah'
  - 'auctionhouse'
  - 'ec'
  - 'enderchest'
  - 'orders'
  BLOCK_ENDER_CHEST_BLOCK: true

ELO:
  STARTING: 0
  GAIN_PER_KILL: 25
  LOSS_PER_DEATH: 20
  MINIMUM: 0
  MAXIMUM: 0

RANKS:
  LT5:
    DISPLAY: '&7LT5'
    ELO: 0
  LT4:
    DISPLAY: '&7LT4'
    ELO: 100
  LT3:
    DISPLAY: '&fLT3'
    ELO: 200
  LT2:
    DISPLAY: '&fLT2'
    ELO: 300
  LT1:
    DISPLAY: '&eLT1'
    ELO: 400
  HT5:
    DISPLAY: '&eHT5'
    ELO: 600
  HT4:
    DISPLAY: '&6HT4'
    ELO: 800
  HT3:
    DISPLAY: '&6HT3'
    ELO: 1000
  HT2:
    DISPLAY: '&cHT2'
    ELO: 1200
  HT1:
    DISPLAY: '&c&lHT1'
    ELO: 1500

LEVELS:
  XP_PER_KILL: 50
  BASE_XP: 100
  XP_INCREASE_PER_LEVEL: 50
  MAX_LEVEL: 100

ANTI_KILL_FARMING:
  ENABLED: true
  MAX_REWARDED_KILLS: 3
  COOLDOWN: '5m'
  REDUCED_ELO: 0
  REDUCED_XP: 0
  APPLY_ELO_LOSS: false

BROADCASTS:
  LEVEL_UP:
    GLOBAL: true
    MESSAGE: '&8[&cPVP&8] &f%player_name% &7has reached PvP Level &c%pvp_level%&7!'
  RANK_UP:
    GLOBAL: true
    MESSAGE: '&8[&cPVP&8] &f%player_name% &7ranked up to %pvp_rank% &7with &c%pvp_elo% &7elo!'
  RANK_DOWN:
    GLOBAL: false
    MESSAGE: '&8[&cPVP&8] &f%player_name% &7dropped to %pvp_rank% &7with &c%pvp_elo% &7elo!'

SCOREBOARD:
  ENABLED: true
  TITLE:
  - '&c&lPVP ARENA'
  LINES:
  - ''
  - '&fPLAYER: &c%player_name%'
  - '&fRANK: %pvp_rank%'
  - '&fLEVEL: &c%pvp_level%'
  - '&fK/D: &c%pvp_kills%&7/&c%pvp_deaths%'
  - ''
  - '&fARENA RESET'
  - '&c%pvp_arena_reset%'
  - ''
  - '&7play.example.net'
  RESET_FORMAT: '{d}D:{h}H:{m}M:{s}S'
  RESET_DISABLED_TEXT: '&7-'

MENUS:
  QUEUE:
    TITLE: '&8PvP queue'
    SIZE: 27
    CONFIRM:
      MATERIAL: 'EMERALD'
      DISPLAY-NAME: '&aCONFIRM'
    CANCEL:
      MATERIAL: 'BARRIER'
      DISPLAY-NAME: '&cLEAVE'
  LEADERBOARD:
    TITLE: '&8Leaderboards'
    SIZE: 27
    ENTRIES: 10
    LINE: '&7#{position} &f{player} &8- &c{value}'
    ICONS:
