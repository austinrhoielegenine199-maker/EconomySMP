      LEVEL: 'EXPERIENCE_BOTTLE'
      KILLS: 'DIAMOND_SWORD'
      DEATHS: 'SKELETON_SKULL'
      STREAK: 'BLAZE_POWDER'
      JOINS: 'IRON_DOOR'
  HISTORY:
    TITLE: '&8Match history &7- &f{player}'
  ASSIGN:
    TITLE: '&8Assign match'
    SIZE: 27
    CONFIRM:
      MATERIAL: 'EMERALD'
      DISPLAY-NAME: '&aSTART MATCH'
    BLOCKED:
      MATERIAL: 'BARRIER'

KITS: {}

