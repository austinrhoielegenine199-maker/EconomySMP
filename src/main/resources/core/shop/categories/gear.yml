# Number of GUI rows (1-6). Each row contains 9 slots; ROW overrides SIZE.
ROW: 3

# Configuration section for Gear Menu.
GEAR-MENU:
  TITLE: '&8gear - shop'
  SIZE: 27
  # Custom item enchantments and glow effects can be configured per item:
  # ENCHANTMENTS:
  #   MENDING: 1
  #   UNBREAKING: 3
  # Or list format:
  # ENCHANTMENTS:
  #   - "mending:1"
  #   - "unbreaking:3"
  # GLINT: true
  # Configuration section for Obsidian Item.
  OBSIDIAN-ITEM:
    # The text or value for Currency. Available options: Any valid string text
    CURRENCY: MONEY
    MATERIAL: OBSIDIAN
    DISPLAY-NAME: '&fObsidian'
    SLOT: 9
    # The numerical value for Price Per Unit. Available options: Any valid integer
    PRICE-PER-UNIT: 100
    LORE:
    - '&fBuy price: &a$100'
