# EconomySMP Core - Shop settings
price-lore: "&a%price%"
lore-line: 1
cooldown: 1
economy:
  provider: VAULT
  currency-format: "#,##0.##"
  abbreviations:
    enabled: true
    values:
      - "K"
      - "M"
      - "B"
      - "T"
gui-titles:
  end: "&8ᴇɴᴅ ꜱʜᴏᴘ %page%"
  gear: "&8ɢᴇᴀʀ ꜱʜᴏᴘ %page%"
  food: "&8ꜰᴏᴏᴅ ꜱʜᴏᴘ %page%"
  nether: "&8ɴᴇᴛʜᴇʀ ꜱʜᴏᴘ %page%"
back-button:
  material: RED_STAINED_GLASS_PANE
  slot: 18
  display-name: "&#FF0000ʙᴀᴄᴋ"
  lore:
    - "&fClick to return to the shop menu"
sounds:
  click: "ui.button.click"
  decline: "entity.villager.no"
  buy: "entity.experience_orb.pickup"
  open: ""
  add-item: "entity.experience_orb.pickup"
  failed: "entity.villager.no"
prefix:
  enabled: true
  text: "&#00fc88ꜱʜᴏᴘ &7» "
messages:
  no-permission: "&cYou don't have permission."
  player-only: "&cOnly players can use this command."
  reload: "&aShop configuration reloaded."
  category-unavailable: "&cThat shop category is unavailable."
  shop-unavailable: "&cThe shop is currently unavailable."
  not-enough-money: "&cYou don't have enough money."
  not-enough-flakes: "&cYou don't have enough Flakes."
  transaction-failed: "&cThe transaction failed."
  inventory-full: "&cYou don't have enough inventory space."
  add-hand-item: "&aAdded the item in your hand to the shop."
  remove-item: "&aRemoved the shop item."
  add-shop: "&aAdded the shop category."
  remove-shop: "&aRemoved the shop category."
  no-access: "&cYou don't have access to this shop."
  cooldown: "&cPlease wait before doing that again."
purchase-success:
  chat: true
  actionbar: true
  title: false
  subtitle: false
purchase-flakes:
  chat: true
  actionbar: true
  title: false
  subtitle: false
  message: "&aPurchased with Flakes."
placeholders:
  total-items: "%shop_total_items%"
  total-items-formatted: "%shop_total_items_formatted%"
  total-buyed: "%shop_total_buyed%"
  formatted-total: "%shop_formatted_total%"
