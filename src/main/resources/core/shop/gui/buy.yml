# Standard item purchase confirmation GUI
fill:
  enabled: false
  material: BLACK_STAINED_GLASS_PANE
  display-name: " "
  sound: "ENTITY_VILLAGER_NO"
  slots: "0-8,9-17,18-26"
confirm-menu:
  rows: 3
  title: "&8ʙᴜʏɪɴɢ"
  confirm:
    slot: 23
    material: LIME_STAINED_GLASS_PANE
    display-name: "&#04fc04ᴄᴏɴғɪʀᴍ"
    lore: ["&fClick to purchase"]
  cancel:
    slot: 21
    material: RED_STAINED_GLASS_PANE
    display-name: "&#fc0404ᴄᴀɴᴄᴇʟ"
    lore: ["&fClick to cancel"]
  item:
    slot: 13
    material: "%clicked-item%"
    amount: "%clicked-amount%"
    lore:
      - "&fAmount: &a%amount%"
      - "&fPrice: &a%price%"
  quantity-buttons:
    add-1: {slot: 15, amount: 1, action: add1, material: LIME_STAINED_GLASS_PANE, display-name: "&a+1"}
    add-10: {slot: 16, amount: 10, action: add10, material: LIME_STAINED_GLASS_PANE, display-name: "&a+10"}
    add-64: {slot: 17, amount: 64, action: add64, material: LIME_STAINED_GLASS_PANE, display-name: "&a+64"}
    remove-1: {slot: 11, amount: 1, action: remove1, material: RED_STAINED_GLASS_PANE, display-name: "&c-1"}
    remove-10: {slot: 10, amount: 10, action: remove10, material: RED_STAINED_GLASS_PANE, display-name: "&c-10"}
    remove-64: {slot: 9, amount: 64, action: remove64, material: RED_STAINED_GLASS_PANE, display-name: "&c-64"}
