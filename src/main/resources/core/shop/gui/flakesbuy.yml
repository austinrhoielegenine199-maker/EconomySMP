# Flakes purchase confirmation GUI
confirm-menu:
  rows: 3
  title: "&8ʙᴜʏɪɴɢ ғʟᴀᴋᴇs"
  confirm:
    slot: 15
    material: LIME_STAINED_GLASS_PANE
    display-name: "&#04fc04ᴄᴏɴꜰɪʀᴍ"
  cancel:
    slot: 11
    material: RED_STAINED_GLASS_PANE
    display-name: "&#fc0404ᴄᴀɴᴄᴇʟ"
