command-usage: |-
  &7Sell commands:
  &f/sell &7- Open the sell menu
  &f/sell all &7- Sell all configured items in your inventory
  &f/sell worth &7- Open the item worth menu
  &f/sell history &7- View your recent sell history
  &f/sell progress <category> &7- View category progression
  &f/worth &7- View configured item prices
  &f/worthtoggle &7- Toggle worth display
command-usage-admin: |-
  &7Sell administration:
  &f/sell reload &7- Reload Sell configuration
  &f/sellaxe <player> &7- Give a Sellaxe
  &f/setworth <price> &7- Set the held item's sell price
  &f/sellhistory [player] &7- View sell history
  &f/sell reset <player> &7- Reset Sell progression
