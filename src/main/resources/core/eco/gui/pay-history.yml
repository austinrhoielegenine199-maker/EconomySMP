# Payment history GUI
rows: 6
history-slots: "0-44"
title: "&8ᴘᴀʏᴍᴇɴᴛ ʟᴏɢꜱ %player% (Page %page%)"

refresh:
  slot: 49
  material: ANVIL
  displayname: "&#00fc88ʀᴇꜰʀᴇꜱʜ"
  lore:
    - "&fClick to refresh"

receive-pay:
  material: LIME_STAINED_GLASS_PANE
  displayname: "&#04fc04+%amount%"
  lore:
    - "&8Received"
    - ""
    - "&fID: &#04fc04%id%"
    - "&fAmount: &#04fc04+%amount%"
    - "&fFrom: &#00A0FC%from%"
    - "&fTo: &#00A0FC%to%"
    - "&fDate &7%date%"

gift-pay:
  material: RED_STAINED_GLASS_PANE
  displayname: "&#fc0404-%amount%"
  lore:
    - "&8Gift"
    - ""
    - "&fID: &#fc0404%id%"
    - "&fAmount: &#fc0404-%amount%"
    - "&fFrom: &#00A0FC%from%"
    - "&fTo: &#00A0FC%to%"
    - "&fDate &7%date%"

next-page:
  slot: 53
  material: ARROW
  displayname: "&#00fc88ɴᴇxᴛ"
  lore:
    - "&fClick to go to the next page"

previous-page:
  slot: 45
  material: ARROW
  displayname: "&#00fc88ᴘʀᴇᴠɪᴏᴜꜱ"
  lore:
    - "&fClick to go to the previous page"

sort:
  slot: 48
  material: HOPPER
  displayname: "&#00fc88ꜱᴏʀᴛ"
  active-prefix: "&#00fc88● "
  inactive-prefix: "&f● "
  keys:
    - "newest"
    - "oldest"
    - "highest_price"
    - "lowest_price"
  options:
    - "Newest"
    - "Oldest"
    - "Highest Price"
    - "Lowest Price"

filter:
  slot: 50
  material: CAULDRON
  displayname: "&#00fc88ꜰɪʟᴛᴇʀ"
  active-prefix: "&#00fc88● "
  inactive-prefix: "&f● "
  keys:
    - "name_az"
    - "name_za"
  options:
    - "Name: A-Z"
    - "Name: Z-A"
