# Help messages
command-usage: |
  &#00fc88EconomySMP
  &#00fc88➤ &f/pay <player> <amount>
  &#00fc88➤ &f/bal
  &#00fc88➤ &f/paytoggle
  &#00fc88➤ &f/payhistory

command-usage-admin: |
  &#00fc88EconomySMP Admin
  &#00fc88➤ &f/pay reload
  &#00fc88➤ &f/eco give <player> <amount>
  &#00fc88➤ &f/eco take <player> <amount>
  &#00fc88➤ &f/eco set <player> <amount>
  &#00fc88➤ &f/eco clear <player>
  &#00fc88➤ &f/payhistory <player>
