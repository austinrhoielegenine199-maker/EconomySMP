# Flakes messages. Supported placeholders include %player%, %flakes%, %flakes_send%,
# %flakes_given%, %flakes_taken%, %flakes_received%, %flakes_set%, %target_player%.
prefix-enable: true
prefix: "&#009bffғʟᴀᴋᴇꜱ &7» "
no-permission: '&cYou have no permission for that!'
player-only: 'Only players can use this command!'
player-not-found: "&cPlayer not found"
reload-success: '&#009bffFlakes reloaded successfully!'
invalid-number: "&cInvalid number!"
not-enough-flakes: "&cYou do not have enough Flakes!"
not-enough-money: "&cYou do not have enough money!"
max-level-reached: "&cYou reached the max Flakes level!"
self-pay: "&cYou cannot give yourself Flakes!"
economy-not-available: "&cThe economy system is not available!"
booster-item-received: "&fYou received a &#009bff%amount%x &fFlakes Booster for &#009bff%time% &fhours!"
booster-expired: "&cYour Flakes Booster has expired!"
booster-activated: "&fYour Flakes Booster is now active for &#009bff%time%&f hours!"
booster-remaining: "&fYour Flakes Booster is active for another &#009bff%time%&f!"
gui-updated: "&#009bffFlakes GUI reloaded successfully!"
send-flakes-chat-input: |
  &cPlease write the number in chat,
  &cor type cancel to cancel the input!
send-flakes-chat-cancel: "&cInput cancelled!"
flakes-balance: "&fBalance: &#009bff%flakes% Flakes"
flakes-balance-other: "&#009bff%target% &fhas &#009bff%flakes% Flakes&f!"
flakes-send: "&fYou sent &#009bff%flakes_send% Flakes &fto &#009bff%player%"
flakes-received: "&fYou received &#009bff%flakes_received% Flakes &ffrom &#009bff%target_player%"
flakes-given: "&fYou gave &#009bff%flakes_given% Flakes &fto &#009bff%player%!"
flakes-taken: "&fYou took &#009bff%flakes_taken% Flakes &ffrom &#009bff%player%!"
flakes-set: "&fYou set the Flakes of &#009bff%player% &fto &#009bff%flakes_set%&f!"
clear-all-success: "&#009bffSuccessfully cleared all Flakes and levels from all players!"
command-usage: |
  &#009bff&lFLAKES
  &#009bff➤ &f/flakes
  &#009bff➤ &f/flakes pay <player> <amount>
  &#009bff➤ &f/flakes bal <player>
command-usage-admin: |
  &#009bff&lFLAKES ADMIN
  &#009bff➤ &f/flakes reload
  &#009bff➤ &f/flakes give <player> <amount>
  &#009bff➤ &f/flakes take <player> <amount>
  &#009bff➤ &f/flakes set <player> <amount>
