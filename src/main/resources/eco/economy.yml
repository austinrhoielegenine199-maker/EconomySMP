# EconomySMP economy module configuration
# Provider: VAULT (requires Vault + a compatible economy plugin)
provider: VAULT
currency:
  name: "Coins"
  singular: "Coin"
  symbol: "$"
  format: "#,##0.##"
  abbreviations:
    enabled: true
    thousand: "K"
    million: "M"
    billion: "B"
  starting-balance: 0.0
  max-balance: 1000000000000.0
transactions:
  enabled: true
  log-to-console: true
  prevent-negative-balances: true
  max-single-transaction: 1000000000.0
messages:
  prefix: "&aEconomy &7» "
  no-permission: "&cYou don't have permission."
  player-only: "&cOnly players can use this command."
  invalid-amount: "&cEnter a valid positive amount."
  insufficient-funds: "&cYou don't have enough money."
  transaction-success: "&aTransaction completed: &f%amount%"
  transaction-failed: "&cThe transaction failed. Your balance was not changed."
