name: EconomySMP
version: '1.0.0'
main: com.archiveaustxn.EconomySMP
api-version: '1.21'
author: ArchiveAustxn
description: EconomySMP Core with integrated economy, shop, and sell modules
softdepend: [Vault, PlaceholderAPI]
commands:
  shop:
    description: Open and administer the EconomySMP shop
    usage: /shop
    permission: economysmp.shop.use
    permission-message: "&cYou don't have permission."
  sell:
    description: Open the sell menu or sell all configured items
    usage: /sell [all|reload]
    permission: economysmp.sell.use
  worth:
    description: View configured item sell prices
    usage: /worth
    permission: economysmp.sell.use
  pay:
    description: Pay another player
    usage: /pay <player> <amount>
    permission: economysmp.pay
  money:
    description: Check your balance
    aliases: [bal, balance]
    usage: /money [player]
  eco:
    description: Economy administration commands
    usage: /eco
    permission: economysmp.admin
  payhistory:
    description: View payment history
    usage: /payhistory [player]
    permission: economysmp.payhistory
  paytoggle:
    description: Toggle receiving payments
    usage: /paytoggle
    permission: economysmp.paytoggle
permissions:
  economysmp.shop.use:
    default: true
  economysmp.shop.reload:
    default: op
  economysmp.shop.admin:
    default: op
    children:
      economysmp.shop.use: true
      economysmp.shop.reload: true
  economysmp.admin:
    default: op
    children:
      economysmp.bal.other: true
  economysmp.bal.other:
    default: op
  economysmp.pay:
    default: true
  economysmp.payhistory:
    default: true
  economysmp.payhistory.other:
    default: op
  economysmp.paytoggle:
    default: true
  economysmp.sell.use:
    default: true
  economysmp.sell.admin:
    default: op
