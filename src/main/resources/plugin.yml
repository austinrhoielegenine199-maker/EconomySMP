name: EconomySMP
version: '1.0.0'
main: com.archiveaustxn.EconomySMP
api-version: '1.21'
author: ArchiveAustxn
description: EconomySMP Core with integrated shop module
softdepend: [Vault, PlaceholderAPI]
commands:
  shop:
    description: Open the EconomySMP shop
    usage: /shop
    permission: shop.use
permissions:
  shop.use:
    default: true
  shop.reload:
    default: op
  shop.admin:
    default: op
    children:
      shop.use: true
      shop.reload: true
