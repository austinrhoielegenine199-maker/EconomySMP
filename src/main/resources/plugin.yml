name: EconomySMP
version: '1.0.0'
main: com.archiveaustxn.EconomySMP
api-version: '1.21'
author: ArchiveAustxn
description: EconomySMP Core with integrated economy, shop, and sell modules
softdepend: [Vault, PlaceholderAPI]
folia-supported: true
commands:
  flakes:
    description: View, pay, and administer Flakes currency
    usage: /flakes [bal|pay|give|take|set|reload]
    aliases: [flake]
  home:
    description: Open your homes menu or teleport to a home
    usage: /home [1-5|team|reload]
    aliases: [homes]
  sethome:
    description: Save your current location as a home
    usage: /sethome <1-5>
  delhome:
    description: Delete one of your homes
    usage: /delhome <1-5>
  team:
    description: Manage your team and shared team home
    usage: /team <create|invite|join|leave|delete|sethome|home|info>
    aliases: [teams]
  shop:
    description: Open and administer the EconomySMP shop
    usage: /shop
    permission: economysmp.shop.use
    permission-message: "&cYou don't have permission."
  sell:
    description: Open the sell menu or sell all configured items
    usage: /sell [all|history|worth|progress|reload]
    aliases: [sellgui]
    permission: economysmp.sell.use
  worth:
    description: View configured item sell prices
    usage: /worth [page]
    permission: economysmp.sell.use
  sellaxe:
    description: Give or use a Sellaxe
    usage: /sellaxe
    permission: sell.sellaxe
  worthtoggle:
    description: Toggle item worth display
    usage: /worthtoggle
    permission: economysmp.sell.use
  sellhistory:
    description: View your sell history
    usage: /sellhistory [page]
    permission: economysmp.sell.use
  setworth:
    description: Set the sell price of the held item
    usage: /setworth <price>
    permission: sell.setworth
  pay:
    description: Pay another player
    usage: /pay <player> <amount>
    permission: economysmp.pay
  money:
    description: Check your balance
    aliases: [bal, balance]
    usage: /money [player]
  eco:
    description: Economy administration commands
    usage: /eco
    permission: economysmp.admin
  payhistory:
    description: View payment history
    usage: /payhistory [player]
    permission: economysmp.payhistory
  paytoggle:
    description: Toggle receiving payments
    usage: /paytoggle
    permission: economysmp.paytoggle
permissions:
  flakes.admin:
    default: op
  flakes.use:
    default: true
  flakes.vip:
    default: false
  flakes.bal:
    default: op
  flakes.pay:
    default: true
  home.reload:
    default: op
  home.bypass:
    default: op
  home.others:
    default: op
  home.limit.1:
    default: false
  home.limit.2:
    default: false
  home.limit.3:
    default: false
  home.limit.4:
    default: false
  home.limit.5:
    default: false
  team.admin:
    default: op
  team.home.bypass:
    default: op
  team.home.access:
    default: true
  team.home.set:
    default: op
  economysmp.shop.use:
    default: true
  economysmp.shop.reload:
    default: op
  economysmp.shop.admin:
    default: op
    children:
      economysmp.shop.use: true
      economysmp.shop.reload: true
  economysmp.admin:
    default: op
    children:
      economysmp.bal.other: true
      economysmp.sell.admin: true
      sell.reload: true
      sell.sellaxe: true
      sell.setworth: true
      sell.reset: true
  economysmp.bal.other:
    default: op
  economysmp.pay:
    default: true
  economysmp.payhistory:
    default: true
  economysmp.payhistory.other:
    default: op
  economysmp.paytoggle:
    default: true
  economysmp.sell.use:
    default: true
  economysmp.sell.admin:
    default: op
  sell.use:
    default: true
  sell.reload:
    default: op
  sell.sellaxe:
    default: op
  sell.setworth:
    default: op
  sell.vip:
    default: false
  sell.history.other:
    default: op
  sell.reset:
    default: op
  sell.admin:
    default: op
    children:
      sell.reload: true
      sell.sellaxe: true
      sell.use: true
      sell.setworth: true
      sell.history.other: true
      sell.reset: true
